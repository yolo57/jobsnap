workflows:
  ios-capacitor:
    name: JobSnap iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.yolo57.jobsnap"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    integrations:
      app_store_connect: Codemagic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add Capacitor iOS platform
        script: |
          npm install @capacitor/ios
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icons
        script: |
          npx capacitor-assets generate --ios --iconBackgroundColor "#2563EB" --iconBackgroundColorDark "#2563EB"
      - name: Set export compliance flag
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          BUILD_NUMBER=$(date +%s)
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - damasia333@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
